name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # egui needs these to link; the headless build below does not.
      - name: Install GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test

      # Proves the CLI/HTTP path still builds without a display stack.
      # Runs before the real build: same bin path, so it must not be what we ship.
      - name: Build headless
        if: runner.os == 'Linux'
        run: cargo build --release --no-default-features

      - run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: rsttherm-${{ runner.os }}
          path: |
            target/release/rsttherm
            target/release/rsttherm.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rsttherm-*
          merge-multiple: true

      - run: gh release create "$GITHUB_REF_NAME" rsttherm rsttherm.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
