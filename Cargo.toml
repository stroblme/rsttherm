[package]
name = "rsttherm"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Thermal Master P1/P3 USB thermal cameras: CLI, HTTP API and a live viewer"
repository = "https://github.com/stroblme/rsttherm"

[workspace]
members = [".", "android/native"]
# android/native is cross-compiled for the phone by `make android`, never by a desktop build.
default-members = ["."]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
tiny_http = "0.12.0"
nusb = "0.2.7"
eframe = { version = "0.36.0", optional = true, default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
png = { version = "0.18.1", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }

# The Android app's entry point and its way to USB devices; see src/android.rs.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = "0.6.1"
jni = "0.22.4"
ndk-context = "0.1.1"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:png", "dep:serde"]
